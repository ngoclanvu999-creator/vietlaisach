name: Keep Render Alive 24/7

on:
  schedule:
    # Chạy mỗi 10 phút để giữ máy chủ Render luôn thức, không bị ngủ đông
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -f https://vietlaisach-pro.onrender.com/api/health || echo "Ping failed or server waking up"
