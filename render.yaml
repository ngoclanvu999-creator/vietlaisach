services:
  - type: web
    name: vietlaisach-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Bản Web KHÔNG dùng khóa Gemini chung: mỗi người tự dán khóa của mình
      # trong phần Cài Đặt AI, khóa nằm trong trình duyệt của họ và máy chủ
      # không lưu. Vì vậy ở đây không cần đặt GEMINI_API_KEY nữa.
      #
      # Muốn giới hạn ai được vào trang thì đặt thêm APP_ACCESS_TOKEN:
      # - key: APP_ACCESS_TOKEN
      #   sync: false
